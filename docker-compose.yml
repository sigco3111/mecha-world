# MECHA WORLD: NEXUS — 后端基础设施（GDD §37.5）
# 用法：
#   docker compose up -d redis qdrant   # 只起依赖（开发推荐）
#   docker compose up -d                # 起 ai-server + redis + qdrant + caddy
# 注意：ai-server 不配置 REDIS_URL/QDRANT_URL 时自动走内存兜底，可不依赖本文件。
services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrant_data:/qdrant/storage"]
    restart: unless-stopped

  ai-server:
    build: ./apps/ai-server
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
    ports: ["8787:8787"]
    depends_on: [redis, qdrant]
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports: ["443:443", "80:80"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [ai-server]
    restart: unless-stopped

volumes:
  redis_data: {}
  qdrant_data: {}
  caddy_data: {}
  caddy_config: {}
